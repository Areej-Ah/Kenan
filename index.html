*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#130c1b}
body{font-family:'Cormorant Garamond',serif;color:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}

/* Blurred copy of the scene fills any space the picture can't cover (tall phones) */
.backdrop{position:fixed;inset:-40px;background:var(--bg) center/cover no-repeat;filter:blur(28px) brightness(.45) saturate(1.1);z-index:0}

.scene{position:fixed;inset:0;overflow:hidden;z-index:1}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(8,4,14,.45) 100%)}

/* The stage keeps the picture's exact proportions so every layer stays glued to it */
.stage{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0}

.stage.letterbox{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
.base{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none}
.layer{position:absolute;display:block;pointer-events:none;user-select:none}

/* Twinkling stars, clipped to the window's sky */
.sky{position:absolute;inset:0;pointer-events:none;clip-path:polygon(53.409% 0.000%,75.478% 0.000%,75.478% 41.658%,70.933% 41.658%,70.933% 44.633%,65.490% 44.633%,64.474% 35.069%,53.409% 33.794%)}
.star{position:absolute;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 6px 1px rgba(226,205,255,.85);animation:twinkle var(--d,3s) ease-in-out var(--dl,0s) infinite;will-change:opacity,transform}
.star.big:before,.star.big:after{content:"";position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transform:translate(-50%,-50%)}
.star.big:before{width:9px;height:1px}
.star.big:after{width:1px;height:9px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.9),transparent)}
@keyframes twinkle{0%,100%{opacity:var(--lo,.25);transform:translate(-50%,-50%) scale(.6)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}}
.shooting{position:absolute;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));opacity:0;transform-origin:100% 50%}
.shooting.go{animation:shoot 1.1s ease-out forwards}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(var(--ang)) scaleX(.2)}15%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--ang)) scaleX(1)}}

#fireworks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

/* "open me" invitation: glowing bow, sparkles and a hand-written note */
.bow-glow{position:absolute;left:49.6%;top:67.5%;width:20%;height:19%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,222,250,.5),rgba(206,150,255,.22) 42%,transparent 70%);mix-blend-mode:screen;pointer-events:none;animation:breathe 3s ease-in-out infinite;transition:opacity .6s}
.bow-fx{position:absolute;inset:0;pointer-events:none;transition:opacity .35s ease}
.case-hit:hover ~ .bow-fx .bow-glow{animation-duration:1.4s}
@keyframes breathe{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.92)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.spark{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%) scale(0);background:#fff6e6;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 6px #e7b9ff);pointer-events:none;animation:spark var(--d,2.6s) ease-in-out var(--dl,0s) infinite;transition:opacity .5s}
@keyframes spark{0%,100%{transform:translate(-50%,-50%) scale(0) rotate(0)}45%{transform:translate(-50%,-50%) scale(1) rotate(45deg)}60%{transform:translate(-50%,-50%) scale(.2) rotate(70deg)}}
/* Guitar case: the closed lid lifts away while the painted "open case" picture rises in */
.case-3d{position:absolute;inset:0;perspective:4500px;perspective-origin:53% 66%;pointer-events:none}
.open-img{opacity:0;-webkit-mask-image:linear-gradient(180deg,transparent 0,transparent 40%,#000 49%,#000 100%);mask-image:linear-gradient(180deg,transparent 0,transparent 40%,#000 49%,#000 100%);-webkit-mask-size:100% 220%;mask-size:100% 220%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 40%;mask-position:0 40%}
.lid{transform-origin:5.544% 20.705%;transform:rotate(4.98deg) rotateX(0deg) rotate(-4.98deg)}
.lid img{position:absolute;inset:0;width:100%;height:100%;display:block}
.case-hit{position:absolute;left:24.8%;top:61.5%;width:58.5%;height:28%;border:0;background:transparent;cursor:pointer;border-radius:40px;z-index:5;animation:nudge 4.5s ease-in-out 2s infinite}
.case-hit:focus-visible{outline:2px dashed #efd5ff;outline-offset:4px}

.opened .open-img{animation:openReveal 1.5s cubic-bezier(.35,.1,.25,1) forwards}
.opened .lid{animation:lidLift .75s ease-in forwards}
.closing .case-hit{pointer-events:none}
.case-hit{animation:none}
.closing .open-img{animation:openHide 1.3s cubic-bezier(.5,0,.6,1) forwards}
.closing .lid{animation:lidDrop 1.3s forwards}
@keyframes openReveal{
  0%{opacity:0;-webkit-mask-position:0 40%;mask-position:0 40%}
  30%{opacity:1}
  100%{opacity:1;-webkit-mask-position:0 100%;mask-position:0 100%}
}
@keyframes openHide{
  0%{opacity:1;-webkit-mask-position:0 100%;mask-position:0 100%}
  75%{opacity:1}
  100%{opacity:0;-webkit-mask-position:0 40%;mask-position:0 40%}
}
@keyframes lidLift{
  0%{opacity:1;transform:rotate(4.98deg) rotateX(0deg) rotate(-4.98deg)}
  25%{opacity:1;transform:rotate(4.98deg) rotateX(14deg) rotate(-4.98deg)}
  100%{opacity:0;transform:rotate(4.98deg) rotateX(55deg) rotate(-4.98deg)}
}
@keyframes lidDrop{
  0%,55%{opacity:0;transform:rotate(4.98deg) rotateX(55deg) rotate(-4.98deg)}
  88%{opacity:1;transform:rotate(4.98deg) rotateX(0deg) rotate(-4.98deg)}
  94%{opacity:1;transform:rotate(4.98deg) rotateX(3deg) rotate(-4.98deg)}
  100%{opacity:1;transform:rotate(4.98deg) rotateX(0deg) rotate(-4.98deg)}
}
@keyframes nudge{0%,88%,100%{transform:none}91%{transform:translateY(-3px) rotate(-.4deg)}94%{transform:translateY(0) rotate(.4deg)}97%{transform:translateY(-2px)}}

/* The birthday message flies out of the case */
.note-card{position:absolute;z-index:24;left:var(--cx,26%);top:var(--cy,45%);width:min(280px,74vw);max-height:calc(100% - 32px);overflow:auto;padding:clamp(12px,2vmin,18px) clamp(14px,2.4vmin,22px) clamp(10px,1.6vmin,14px);text-align:center;color:var(--ink);background:linear-gradient(145deg,#f7e8c9,#e8d1a8);border:1px solid #fff1d6;box-shadow:0 15px 45px #09050d99,0 0 34px #d5aaff66;clip-path:polygon(1% 2%,99% 0,100% 98%,0 100%);opacity:0;visibility:hidden;transform:translate(-50%,-50%) translate(var(--fx,0px),var(--fy,0px)) scale(.08) rotate(-14deg);transition:opacity .5s ease,transform 1.1s cubic-bezier(.2,.9,.25,1.05),visibility 0s 1.1s}
.opened .note-card.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) rotate(-1.5deg);transition:opacity .5s ease,transform 1.1s cubic-bezier(.2,.9,.25,1.05),visibility 0s}
.note-card .music{font-size:clamp(15px,2vmin + 5px,19px);color:#87619d;letter-spacing:.4em}
.note-card h1{font:500 clamp(22px,3vmin + 7px,30px) 'Cormorant Garamond',serif;margin:2px 0 6px;color:#523765}
.note-card p{font-size:clamp(13.5px,1.2vmin + 7.5px,16.5px);line-height:1.35;margin:6px 0}
.note-card h1 span{font-style:italic;font-size:.82em}
.note-card .sign{font-style:italic;color:#795d8c;margin-top:9px}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

const IW=1672, IH=941;
const STARS=[[1155, 81, 229.0], [969, 253, 227.0], [1015, 16, 129.0], [1110, 20, 125.0], [1071, 234, 93.0], [1070, 42, 87.0], [1083, 268, 87.0], [1126, 177, 84.0], [1230, 183, 83.0], [909, 109, 80.0], [1216, 284, 77.0], [1171, 277, 20.0], [1156, 38, 20.0], [1238, 112, 20.0], [930, 95, 20.0], [1224, 155, 20.0], [1154, 219, 20.0], [1186, 129, 20.0], [1225, 68, 20.0], [1045, 202, 20.0], [1211, 227, 20.0], [928, 225, 20.0], [1050, 229, 20.0], [1128, 266, 20.0], [913, 299, 20.0], [1165, 105, 20.0], [1065, 8, 20.0], [1025, 10, 20.0], [1133, 6, 20.0], [1006, 271, 20.0]];
const SKY=[[893, 0], [1262, 0], [1262, 392], [1186, 392], [1186, 420], [1095, 420], [1078, 330], [893, 318]];
const scene=document.getElementById('scene'),stage=document.getElementById('stage'),sky=document.getElementById('sky');
const gift=document.getElementById('gift'),card=document.getElementById('card');
const canvas=document.getElementById('fireworks'),ctx=canvas.getContext('2d');
let scale=1,offX=0,offY=0,opened=false;

/* ---------- responsive layout ---------- */
// Focus area that must always stay visible: the window (fireworks) and the whole guitar case.
const FOCUS={x0:.235,x1:.845,y0:.03,y1:.93};
function layout(){
  const vw=innerWidth,vh=innerHeight;
  const portrait=vh>vw*1.05;
  let cx,cy;
  if(portrait){
    // phones held upright: show the whole room edge to edge, message underneath once opened
    scale=vw/(.96*IW);
    const sw=IW*scale,sh=IH*scale;
    offX=(vw-sw)/2;
    cx=vw/2;
    const cardH=card.offsetHeight;
    if(opened){
      const total=sh*.9+cardH-10;
      const start=Math.max(Math.max(14,vh*.03),(vh-total)/2-10);
      offY=start;
      cy=Math.min(offY+sh*.9-10+cardH/2,vh-cardH/2-16);
    }else{offY=vh*.46-sh/2;cy=vh*.5}
  }else{
    // laptops / landscape: always fill the screen, no side bars
    scale=Math.max(vw/IW,vh/IH);
    const sw=IW*scale,sh=IH*scale;
    offX=Math.min(0,Math.max(vw-sw,vw/2-.5*sw));
    if(sw>vw){const lo=vw-.885*sw,hi=-.004*sw;if(lo<=hi)offX=Math.min(hi,Math.max(lo,offX));}
    // crop from the top of the sky first so the whole guitar case always stays in view
    const f=Math.min(1,vh/sh),top=Math.min(1-f,Math.max(0,.9-f));
    offY=-top*sh;
    if(vw>=760){cx=Math.max(190,Math.min(offX+.25*sw,vw*.28));cy=vh*.46}
    else{cx=vw/2;cy=vh*.5}
  }
  stage.style.transform=`translate(${offX}px,${offY}px) scale(${scale})`;
  stage.classList.toggle('letterbox',IH*scale<vh-2);
  const caseC=toView(.54,.71);
  card.style.setProperty('--cx',cx+'px');card.style.setProperty('--cy',cy+'px');
  card.style.setProperty('--fx',(caseC.x-cx)+'px');card.style.setProperty('--fy',(caseC.y-cy)+'px');
  sizeCanvas();sizeGL();
}
function toView(fx,fy){return{x:offX+fx*IW*scale,y:offY+fy*IH*scale}}

/* ---------- stars ---------- */
function rnd(a,b){return a+Math.random()*(b-a)}
function inSky(x,y){let c=false;for(let i=0,j=SKY.length-1;i<SKY.length;j=i++){const[xi,yi]=SKY[i],[xj,yj]=SKY[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function addStar(x,y,size,big){
  const s=document.createElement('span');s.className='star'+(big?' big':'');
  s.style.left=(x/IW*100)+'%';s.style.top=(y/IH*100)+'%';s.style.width=s.style.height=size+'px';
  s.style.setProperty('--d',rnd(1.6,4.2).toFixed(2)+'s');s.style.setProperty('--dl',(-rnd(0,4)).toFixed(2)+'s');s.style.setProperty('--lo',rnd(.12,.45).toFixed(2));

function shootingStar(){

function launch(){
  // keep bursts clear of the moon
  const right=Math.random()<.75,x=right?rnd(1085,1228):rnd(925,985),ty=right?rnd(115,250):rnd(190,270);
  rockets.push({x,y:405,vx:rnd(-.3,.3),vy:-rnd(6.2,7.4),ty,pal:PALETTES[Math.floor(Math.random()*PALETTES.length)]});
  if(!raf)raf=requestAnimationFrame(tick);
}
function burst(x,y,pal){
  const n=Math.floor(rnd(70,110)),ring=Math.random()<.35,sp=rnd(2.2,3.6);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rnd(-.05,.05),s=ring?sp:rnd(.4,1)*sp;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(55,85),max:85,r:rnd(1.2,2.5),c:pal[i%pal.length],tw:Math.random()<.3})}

}

  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.restore();
  ctx.save();clipSky();ctx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=.06;
    ctx.globalAlpha=.9;ctx.fillStyle='#ffe9c9';ctx.beginPath();ctx.arc(r.x,r.y,1.6,0,7);ctx.fill();
    ctx.globalAlpha=.35;ctx.fillRect(r.x-.6,r.y,1.2,10);
    if(r.y<=r.ty||r.vy>=-.6){burst(r.x,r.y,r.pal);return false}return true});
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.life--;
    if(p.flash){const k=p.life/p.max;ctx.globalAlpha=k*.55;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,40);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,40,0,7);ctx.fill();continue}
    p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.vx*=.975;p.vy*=.975;
    let a=Math.max(0,p.life/p.max);if(p.tw&&p.life<35)a*=Math.random()<.5?.2:1;
    ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.6+.4*a),0,7);ctx.fill();
    ctx.globalAlpha=a*.25;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.2,0,7);ctx.fill();
  }

}
function stopShow(){clearTimeout(showTimer);showTimer=null}
function startShow(){
  if(!opened)return;
  [0,350,700,1150].forEach(t=>setTimeout(()=>{if(opened)launch()},t));
  const loop=()=>{if(!opened)return;launch();if(Math.random()<.35)setTimeout(launch,rnd(150,400));showTimer=setTimeout(loop,rnd(900,1700))};
  showTimer=setTimeout(loop,1600);

/* ---------- "Happy Birthday" on a plucked guitar (synthesised once, played as a normal audio file
   so it also plays on iPhones that are on silent-mode-sensitive Web Audio) ---------- */
let song=null;
function buildSong(){
  const SR=32000,BEAT=.44;
  const N={G2:98,A2:110,B2:123.47,C3:130.81,D3:146.83,E3:164.81,F2:87.31,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  const mel=[['G4',.75],['G4',.25],['A4',1,'C'],['G4',1],['C5',1],['B4',2,'G'],['G4',.75],['G4',.25],['A4',1,'G'],['G4',1],['D5',1],['C5',2,'C'],
             ['G4',.75],['G4',.25],['G5',1,'C'],['E5',1],['C5',1],['B4',1,'F'],['A4',2.6],['F5',.75],['F5',.25],['E5',1,'C'],['C5',1],['D5',1,'G'],['C5',3.4,'C']];
  const CH={C:['C3','G3','C4','E4'],G:['G2','D3','G3','B3'],F:['F2','C3','F3','A3']};
  const total=mel.reduce((a,m)=>a+m[1],0)*BEAT+.5+2.5;
  const out=new Float32Array(Math.ceil(total*SR));
  const pluck=(f,start,dur,gain,bright)=>{
    const P=Math.max(2,Math.round(SR/f)),len=Math.min(Math.floor(dur*SR),out.length-Math.floor(start*SR));
    const y=new Float32Array(len);let lp=0;
    for(let i=0;i<P&&i<len;i++){lp+=bright*((Math.random()*2-1)-lp);y[i]=lp}
    const loss=f>400?.9935:.9965;
    for(let i=P;i<len;i++)y[i]=loss*.5*(y[i-P]+y[i-P+1]);
    const o=Math.floor(start*SR);
    for(let i=0;i<len;i++){const fade=i>len-600?(len-i)/600:1;out[o+i]+=y[i]*gain*fade}
  };
  let t=.35;
  for(const[n,b,c] of mel){
    if(c)CH[c].forEach((k,j)=>pluck(N[k],t+j*.018,2.6,.16,.45));
    pluck(N[n],t,Math.max(.9,b*BEAT+.6),.62,.7);
    t+=b*BEAT;
  }
  // gentle body tone + normalise
  let lp=0,peak=0;for(let i=0;i<out.length;i++){lp+=.55*(out[i]-lp);out[i]=lp;peak=Math.max(peak,Math.abs(lp))}
  const g=.85/(peak||1);for(let i=0;i<out.length;i++)out[i]*=g;
  song={data:out,sr:SR};
}
setTimeout(()=>{try{buildSong()}catch(e){}},300);
let actx=null,src=null,amp=null,fallback=null;
function wavURL(){
  const out=song.data,SR=song.sr,buf=new ArrayBuffer(44+out.length*2),v=new DataView(buf);
  const str=(o,x)=>{for(let i=0;i<x.length;i++)v.setUint8(o+i,x.charCodeAt(i))};
  str(0,'RIFF');v.setUint32(4,36+out.length*2,true);str(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,out.length*2,true);
  for(let i=0;i<out.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,out[i]))*32767,true);
  wavObjectURL=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));return wavObjectURL;
}

let wavObjectURL=null;
function playFallback(){
  try{
    if(!fallback){fallback=new Audio(wavURL());fallback.preload='auto';fallback.volume=1}
    fallback.currentTime=0;
    const p=fallback.play();
    if(p&&p.catch)p.catch(()=>playWebAudio());
  }catch(e){playWebAudio()}
}
function playWebAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!song)buildSong();
    if(!actx)actx=new AC();
    const resume=actx.state==='running'?Promise.resolve():actx.resume();
    resume.then(()=>{
      if(!opened)return;
      const b=actx.createBuffer(1,song.data.length,song.sr);
      b.getChannelData(0).set(song.data);
      src=actx.createBufferSource();src.buffer=b;
      amp=actx.createGain();amp.gain.value=1;
      src.connect(amp);amp.connect(actx.destination);
      src.start();
    }).catch(()=>{});
  }catch(e){}
}
function playSong(){
  try{if(!song)buildSong()}catch(e){return}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  stopSong(true);
  playFallback();
}
function stopSong(now){
  try{if(src&&amp&&actx){const t=actx.currentTime;amp.gain.cancelScheduledValues(t);amp.gain.setValueAtTime(amp.gain.value,t);amp.gain.linearRampToValueAtTime(0,t+(now?.02:.5));src.stop(t+(now?.03:.55));src=null}}catch(e){}
  try{if(fallback)fallback.pause()}catch(e){}
}

function openGift(){
  if(opened||busy)return;opened=true;setBusy(1700);playSong();
  scene.classList.remove('closing');scene.classList.add('opened');
  layout();
  gift.setAttribute('aria-label','Close the guitar case');openTarget=1;
  setTimeout(()=>card.classList.add('show'),1300);
  setTimeout(startShow,1500);
}
function closeGift(){
  if(!opened||busy)return;opened=false;setBusy(2000);
  card.classList.remove('show');          // the message slips back into the case
  stopShow();stopSong();
  setTimeout(()=>{
    scene.classList.remove('opened');scene.classList.add('closing');openTarget=0;
    layout();
    setTimeout(()=>scene.classList.remove('closing'),1400);
  },550);
  gift.setAttribute('aria-label','Open the guitar case');
}
gift.addEventListener('click',()=>opened?closeGift():openGift());
/* ---------- melody ---------- */

addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
layout();
requestAnimationFrame(()=>stage.classList.add('ready'));
})();
</script>
